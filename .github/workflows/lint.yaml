on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPRIVATE: github.com/sig-0/*
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: sig-0/ethcrypto
          token: ${{ secrets.ORG_PAT }}

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          args:
            --config=./.github/golangci.yaml
