on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOPRIVATE: github.com/sig-0/*
    steps:
      - name: Allow access to sig-0 private repos
        run: |
          git config --global url."https://${{ secrets.ORG_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Debug Git Config
        run: git config --list --show-origin

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Go test
        run: go test -shuffle=on -coverprofile coverage.out -timeout 5m ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          slug: sig-0/ethtypes
          files: coverage.out
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test-with-race:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Go race test
        run: go test -race -shuffle=on -timeout 5m ./...
