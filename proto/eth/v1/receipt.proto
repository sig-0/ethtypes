syntax = "proto3";

package eth.v1;

option go_package = "github.com/sig-0/ethtypes/proto/eth/v1";

// Represents a transaction receipt, which contains information about a transaction
// after it has been processed and included in a block
message Receipt {
  bytes transaction_hash = 1;     // Hash of the transaction
  uint64 transaction_index = 2;   // Index of the transaction within the block
  bytes block_hash = 3;           // Hash of the block that contains this transaction
  uint64 block_number = 4;        // Number of the block that contains this transaction
  bytes from = 5;                 // Address of the sender of the transaction
  uint64 cumulative_gas_used = 6; // Total gas used when this transaction was executed
  bytes effective_gas_price = 7;  // Effective gas price used for the transaction (accounting for base fee and priority fee)
  uint64 gas_used = 8;            // Amount of gas used by the transaction
  bytes contract_address = 9;     // Address of the contract created (if this transaction is contract creation), otherwise empty
  uint64 type = 10;               // Type of the transaction (legacy, EIP-1559, etc.)
  uint64 status = 11;             // Status of the transaction (1 = success, 0 = failure)
  bytes logs_bloom = 12;          // Bloom filter for logs generated by this transaction
  repeated Log logs = 13;         // List of logs generated by the transaction
}

// Logs are a mechanism for smart contracts to emit structured data
// during their execution
message Log {
  repeated bytes topics = 1; // the topics referenced in the log
  bytes data = 2; // the data contained in the log (event data)
  bytes address = 3; // the originating address of the event (SC)
}