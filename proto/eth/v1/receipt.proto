syntax = "proto3";

package eth.v1;

option go_package = "github.com/sig-0/ethtypes/proto/eth/v1";

// Represents a transaction receipt, which contains information about a transaction
// after it has been processed and included in a block
message Receipt {
  uint64 cumulative_gas_used = 1; // Total gas used when this transaction was executed
  bool status = 2;                // true -> 1 (success); false -> 0 (failure)
  bytes logs_bloom = 3;           // Bloom filter for logs generated by this transaction
  repeated Log logs = 4;          // List of logs generated by the transaction
}

// Logs are a mechanism for smart contracts to emit structured data
// during their execution
message Log {
  repeated bytes topics = 1; // the topics referenced in the log
  bytes data = 2; // the data contained in the log (event data)
  bytes address = 3; // the originating address of the event (SC)
}