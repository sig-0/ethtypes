syntax = "proto3";

package eth.v1;

option go_package = "github.com/sig-0/ethtypes/proto/eth/v1";

import "eth/v1/tx.proto";

// Represents a single Ethereum block
message Block {
  Header header = 1;
  repeated Transaction transactions = 2; // List of transactions included in the block
}

// Header contains common fields for all block headers, plus an optional payload for type-specific details
message Header {
  uint64 number = 1;              // The block number (height of the block in the chain)
  bytes miner = 2;                // Address of the miner who produced this block
  int64 timestamp = 3;            // Timestamp when the block was mined
  bytes receipts_root = 4;        // Root of the receipts trie (all transaction receipts for this block)
  uint64 gas_used = 5;            // Total gas used by all transactions in the block
  uint64 gas_limit = 6;           // Gas limit for the block
  uint64 size = 7;                // Size of the block in bytes
  bytes mix_hash = 8;             // Hash used in the proof-of-work algorithm (before Ethereum 2.0)
  bytes extra_data = 9;           // Extra data field, often used for miner-encoded information
  bytes logs_bloom = 10;          // Bloom filter for quick searching of logs in the block
  uint64 difficulty = 11;         // The difficulty of mining the block
  bytes parent_hash = 12;         // Hash of the previous block (the parent block)
  bytes state_root = 13;          // Root of the state trie (Ethereum state at the end of this block)
  bytes transactions_root = 14;   // Root of the transactions trie (all transactions for this block)
  uint64 nonce = 15;              // Random value used by the miner in proof-of-work (before Ethereum 2.0)
  uint64 total_difficulty = 16;   // Total cumulative difficulty of the chain up to this block
  bytes sha3_uncles = 17;         // SHA3 hash of the uncles included in the block
  repeated bytes uncles = 18;     // List of uncle block hashes included in this block

  // --- Type-specific fields ---
  oneof payload {
    // Fields specific to an EIP-1559 block header
    EIP1559Payload eip1559 = 19;
    // Fields specific to an EIP-4895 block header
    EIP4895Payload eip4895 = 20;
  }
}

// EIP1559Payload contains gas fee information relating to
// London hardfork transactions
// https://eips.ethereum.org/EIPS/eip-1559
message EIP1559Payload {
  bytes base_fee_per_gas = 1;   // Base fee per gas unit for EIP-1559 blocks
}

// EIP4895Payload contains withdrawals information relating to
// Ethereum 2.0 upgrades
// https://eips.ethereum.org/EIPS/eip-4895
message EIP4895Payload {
  bytes withdrawals_root = 1;   // Root of the withdrawals trie (for withdrawals from validators)
}

// Withdrawal is a withdrawal from a validator in Ethereum 2.0
message Withdrawal {
  uint64 index = 1;           // Index of the withdrawal in the block
  uint64 validator_index = 2; // Index of the validator performing the withdrawal
  bytes recipient = 3;        // Address of the recipient of the withdrawal
  uint64 amount = 4;          // Amount withdrawn (in gwei)
}