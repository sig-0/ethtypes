syntax = "proto3";

package eth.v1;

option go_package = "github.com/sig-0/ethtypes/proto/eth/v1";

import "eth/v1/tx.proto";

// Represents a single Ethereum block
message Block {
  Header header = 1;                     // Associated block header
  repeated Transaction transactions = 2; // List of transactions included in the block
  repeated Withdrawal withdrawals = 3;   // List of validator withdrawals included in the block
  repeated Header uncles = 4;            // List of uncle headers included in the block
}

// Header contains common fields for all block headers, plus an optional payload for type-specific details
message Header {
  bytes hash = 1;                 // The block hash (calculated)
  uint64 number = 2;              // The block number (height of the block in the chain)
  bytes coinbase = 3;             // Address of the block creator
  int64 timestamp = 4;            // Timestamp when the block was created
  bytes receipts_root = 5;        // Root of the receipts trie (all transaction receipts for this block)
  uint64 gas_used = 6;            // Total gas used by all transactions in the block
  uint64 gas_limit = 7;           // Gas limit for the block
  bytes mix_digest = 8;           // Hash used in the proof-of-work algorithm (before Ethereum 2.0)
  bytes extra_data = 9;           // Extra data field, often used for creator-encoded information
  bytes logs_bloom = 10;           // Bloom filter for quick searching of logs in the block
  uint64 difficulty = 11;         // The difficulty of mining the block
  bytes parent_hash = 12;         // Hash of the previous block (the parent block)
  bytes state_root = 13;          // Root of the state trie (Ethereum state at the end of this block)
  bytes transactions_root = 14;   // Root of the transactions trie (all transactions for this block)
  uint64 nonce = 15;              // Random value used by the miner in proof-of-work (before Ethereum 2.0)
  bytes uncles_hash = 16;         // Hash of the uncles block list

  // --- Type-specific fields ---
  oneof payload {
    // Fields specific to an EIP-1559 block header
    EIP1559Payload eip1559 = 17;

    // Fields specific to an EIP-4895 block header
    EIP4895Payload eip4895 = 18;

    // Fields specific to an EIP-4844 block header
    EIP4844Payload eip4844 = 19;

    // Fields specific to an EIP-7685 block header
    EIP7685Payload eip7685 = 20;
  }
}

// EIP1559Payload contains gas fee information relating to
// London hardfork transactions
// https://eips.ethereum.org/EIPS/eip-1559
message EIP1559Payload {
  bytes base_fee_per_gas = 1;   // Base fee per gas unit for EIP-1559 blocks
}

// EIP4895Payload contains withdrawals information relating to
// Ethereum 2.0 upgrades
// https://eips.ethereum.org/EIPS/eip-4895
message EIP4895Payload {
  bytes base_fee_per_gas = 1;   // Base fee per gas unit for EIP-1559 blocks
  bytes withdrawals_root = 2;   // Root of the withdrawals trie (for withdrawals from validators)
}

// EIP4844Payload contains blob gas and beacon block information relating to
// Cancun hardfork blocks
// https://eips.ethereum.org/EIPS/eip-4844
// https://eips.ethereum.org/EIPS/eip-4788
message EIP4844Payload {
  bytes base_fee_per_gas = 1;         // Base fee per gas unit for EIP-1559 blocks
  bytes withdrawals_root = 2;         // Root of the withdrawals trie (for withdrawals from validators)
  uint64 blob_gas_used = 3;           // Total blob gas used by all transactions in the block
  uint64 excess_blob_gas = 4;         // Excess blob gas, used to calculate the blob base fee
  bytes parent_beacon_block_root = 5; // Root of the parent beacon block
}

// EIP7685Payload contains execution layer requests information relating to
// Prague hardfork blocks
// https://eips.ethereum.org/EIPS/eip-7685
message EIP7685Payload {
  bytes base_fee_per_gas = 1;         // Base fee per gas unit for EIP-1559 blocks
  bytes withdrawals_root = 2;         // Root of the withdrawals trie (for withdrawals from validators)
  uint64 blob_gas_used = 3;           // Total blob gas used by all transactions in the block
  uint64 excess_blob_gas = 4;         // Excess blob gas, used to calculate the blob base fee
  bytes parent_beacon_block_root = 5; // Root of the parent beacon block
  bytes requests_hash = 6;            // Hash of the execution layer requests in the block
}

// Withdrawal is a withdrawal from a validator in Ethereum 2.0
message Withdrawal {
  uint64 index = 1;           // Index of the withdrawal in the block
  uint64 validator_index = 2; // Index of the validator performing the withdrawal
  bytes recipient = 3;        // Address of the recipient of the withdrawal
  uint64 amount = 4;          // Amount withdrawn (in gwei)
}