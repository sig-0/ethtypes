syntax = "proto3";

package eth.v1;

option go_package = "github.com/sig-0/ethtypes/proto/eth/v1";

// Represents an Ethereum transaction with common fields and a type-specific payload
message Transaction {
  bytes hash = 1;         // The transaction hash (calculated)
  uint64 nonce = 2;       // Unique identifier for each transaction from a specific account
  bytes from = 3;         // The transaction signer (sender)
  bytes to = 4;           // If the transaction is contract creation, 'to' will be empty
  uint64 gas = 5;         // The gas limit for the transaction
  bytes value = 6;        // The amount of wei sent in the transaction
  bytes data = 7;         // Input data for contract interactions
  bytes v = 8;            // ECDSA signature component 'v' (or y parity)
  bytes r = 9;            // ECDSA signature component 'r'
  bytes s = 10;           // ECDSA signature component 's'

  // --- Type-specific transaction fields ---
  oneof payload {
    Legacy legacy = 11;     // Legacy (pre-EIP-1559) transaction details
    EIP1559 eip1559 = 12;   // EIP-1559 transaction details with dynamic fees
    EIP2930 eip2930 = 13;   // EIP-2930 transaction details with access lists
  }
}

// Additional fields for a legacy transaction
message Legacy {
  bytes gas_price = 1;  // Gas price in the legacy transaction format
}

// Additional fields for an EIP-1559 transaction
message EIP1559 {
  bytes max_priority_fee_per_gas = 1; // Maximum tip a user is willing to pay to the block creator
  bytes max_fee_per_gas = 2;          // Maximum total fee per gas unit
  repeated AccessListEntry access_list = 3; // List of contract addresses and storage keys accessed
  bytes chain_id = 4;                 // The chain ID of the transaction, if any
}

// Additional fields for an EIP-2930 transaction.
message EIP2930 {
  bytes gas_price = 1;                // Gas price for this transaction
  repeated AccessListEntry access_list = 2; // List of contract addresses and storage keys accessed
  bytes chain_id = 3;                 // The chain ID of the transaction, if any
}

// Represents an entry in an access list.
message AccessListEntry {
  bytes address = 1;                // Contract address
  repeated bytes storage_keys = 2;  // Storage keys within the contract to access
}

// Represents a standard "call" transaction object, usually
// as a result of eth_call, eth_estimateGas and others.
//
// This is NOT the same transaction format as with signed transactions,
// seen in eth_sendRawTransaction, which follow a stricter standard.
// The users of this type will need to "guess" the transaction type,
// whether it's Legacy, EIP-1559, EIP-2930, or others, based on the set fields
message CallTx {
  bytes to = 1;                        // destination address (required)
  bytes from = 2;                      // tx originator
  uint64 gas = 3;                      // gas limit for the transaction
  bytes value = 4;                     // value in wei being transferred
  bytes data = 5;                      // execution data of the call, if any
  bytes chain_id = 6;                   // the ID of the chain, if any
  uint64 nonce = 7;                    // the account nonce, if any

  oneof payload {
    Legacy legacy = 8;     // Legacy (pre-EIP-1559) transaction details
    EIP1559 eip1559 = 9;   // EIP-1559 transaction details with dynamic fees
    EIP2930 eip2930 = 10;   // EIP-2930 transaction details with access lists
  }
}
