syntax = "proto3";

package account.v1;

option go_package = "github.com/sig-0/ethtypes/proto/account/v1;account";

// Represents a single Ethereum account
message Account {
  uint64 nonce = 1;       // Account sequence
  bytes balance = 2;      // ETH balance (in wei)
  bytes storage_root = 3; // Hash of the root node of the account storage trie
  bytes code_hash = 4;    // Hash of the EVM code of the account.  For EOAs, this is the hash of an empty string
}