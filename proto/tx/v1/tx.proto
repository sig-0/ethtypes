syntax = "proto3";

package tx.v1;

option go_package = "github.com/sig-0/ethtypes/proto/tx/v1;tx";

// Represents common fields shared by all transaction types
message TransactionCommon {
  bytes hash = 1;         // The transaction hash (calculated)
  uint64 nonce = 2;       // Unique identifier for each transaction from a specific account
  bytes from = 3;         // The transaction signer (sender)
  optional bytes to = 4;  // The recipient address (optional)
  uint64 gas = 5;         // The gas limit for the transaction
  bytes value = 6;        // The amount of wei sent in the transaction
  bytes data = 7;         // Input data for contract interactions
  bytes v = 8;            // ECDSA signature component 'v' (or y parity)
  bytes r = 9;            // ECDSA signature component 'r'
  bytes s = 10;           // ECDSA signature component 's'
}

// Represents a legacy transaction (pre-EIP-1559)
message TransactionLegacy {
  TransactionCommon transaction_common = 1;
  bytes gas_price = 2;  // The gas price in the legacy transaction format
}

// Represents an EIP-1559 transaction with dynamic fees
message Transaction1559 {
  TransactionCommon transaction_common = 1;   // Embeds common transaction fields
  uint64 type = 2;                            // Transaction type (e.g., legacy, 1559, etc.)
  bytes max_priority_fee_per_gas = 3;         // Maximum tip a user is willing to pay to the miner
  bytes max_fee_per_gas = 4;                  // Maximum total fee per gas unit
  repeated AccessListEntry access_list = 5;   // List of contract addresses and storage keys accessed
  bytes chain_id = 6;                         // The chain ID of the transaction, if any
}

// Represents an EIP-2930 transaction (access list transaction)
message Transaction2930 {
  TransactionCommon transaction_common = 1; // Embeds common transaction fields
  uint64 type = 2;                          // Transaction type (e.g., legacy, 1559, etc.)
  bytes gas_price = 3;                      // Gas price for this transaction
  repeated AccessListEntry access_list = 4; // List of contract addresses and storage keys accessed
  bytes chain_id = 5;                       // The chain ID of the transaction, if any
}

// Represents an entry in the access list, specifying a contract address and associated storage keys
message AccessListEntry {
  bytes address = 1;                // Contract address
  repeated bytes storage_keys = 2;  // Storage keys within the contract to access
}

// A collection of transactions
message Transactions {
  repeated TransactionWrapper transactions = 1;
}

// A wrapper message to allow different types of transactions in one field
message TransactionWrapper {
  oneof transaction_type {
    TransactionLegacy tx_legacy = 1;  // Legacy transaction
    Transaction1559 tx_1559 = 2;      // EIP-1559 transaction
    Transaction2930 tx_2930 = 3;      // EIP-2930 transaction
    string hash = 4;
  }
}

// Represents a standard "call" transaction object, usually
// as a result of eth_call, eth_estimateGas and others.
//
// This is NOT the same transaction format as with signed transactions,
// seen in eth_sendRawTransaction, which follow a stricter standard.
// The users of this type will need to "guess" the transaction type,
// whether it's Legacy, EIP-1559, EIP-2930, or others, based on the set fields
message CallTx {
  bytes to = 1;                                 // destination address (required)
  optional bytes from = 2;                      // tx originator
  optional uint64 gas = 3;                      // gas limit for the transaction
  optional bytes gas_price = 4;                 // gas price of the tx (used for pre-EIP-1559 txs)
  optional bytes max_fee_per_gas = 5;           // max fee per gas unit (used for post-EIP-1559 txs)
  optional bytes max_priority_fee_per_gas = 6;  // max priority fee per gas (used for post-EIP-1559 txs)
  optional bytes value = 7;                     // value in wei being transferred
  optional bytes data = 8;                      // execution data of the call, if any
  repeated AccessListEntry access_list = 9;     // access list associated with the tx (used for EIP-2930 txs)
}
